<script>
/* ================================================================
   1. MOCK DATA  (same generator as the previous demo so the numbers match)
   ================================================================ */
const NOW=new Date(2026,9,5);               // demo clock = 05 Oct 2026. In production use: new Date()
const FN=["Aarav","Priya","Rohan","Sneha","Vikram","Anjali","Karan","Meera","Rahul","Pooja","Amit","Neha","Sanjay","Kavita","Deepak","Ritu"];
const LN=["Sharma","Patil","Deshmukh","Iyer","Shah","Mehta","Nair","Joshi","Kulkarni","Gupta","Singh","Rao"];
const SOC=["Sai Krupa CHS","Shree Ganesh CHS","Om Sai Residency","Lotus Heights","Green Park CHS","Sunrise Towers","Harmony CHS","Vasant Vihar","Orchid Apartments","Ocean View CHS"];
const MONTHS=["Jul 2026","Aug 2026","Sep 2026"],DATES=["08 Jul 2026","09 Aug 2026","10 Sep 2026"],MODES=["UPI","Cheque","NEFT","Cash"];
const EXP=[["Security services",24000],["Lift maintenance",9500],["Water tanker",6800],["Common electricity",15200],["Housekeeping",12000]];
const MN=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const ALLM=["Jul 2026","Aug 2026","Sep 2026","Oct 2026","Nov 2026","Dec 2026"];
let seed=7;const rnd=()=>(seed=seed*16807%2147483647)/2147483647;
const societies=SOC.map((n,i)=>({id:i+1,name:n,cfg:{svc:1800,int:21,due:10,nonocc:10,sink:.25,rep:.75,cost:600}})),
  members=[],bills=[],pays=[],exps=[],audit=[],notices=[],exc=[];
let pid=1,eid=0,nid=100;
/* monthly charge for one member from the society's bye-law rates */
function chg(m){const c=socOf(m.soc).cfg,sv=c.svc,rp=Math.round(m.area*c.cost*c.rep/1200),sk=Math.round(m.area*c.cost*c.sink/1200),no=m.let?Math.round(sv*c.nonocc/100):0,pk=m.park||0;return{sv,rp,sk,no,pk,t:sv+rp+sk+no+pk}}
const dueDate=(sid,mo)=>new Date(+mo.split(" ")[1],MN.indexOf(mo.split(" ")[0]),socOf(sid).cfg.due);
/* simple (never compounded) interest from due date until today */

  <div class="g2"><div class="card"><h2>Collection by month</h2>${cols(monthly(ms))}</div><div class="card"><h2>Where the money goes</h2>${donut(groupExp(s))}</div></div>
  <div class="g2"><div class="card"><div class="row-b"><h2>Highest dues</h2>${canNotice()&&td.length?`<button class="ghost" onclick="remDlg()">Send reminders</button>`:""}</div>${td.length?td.map(x=>`<div class="li"><div><b>${esc(x.m.name)}</b><small>Flat ${x.m.flat}, ${x.d.l.length} bill${x.d.l.length>1?"s":""} pending</small></div><b class="bad">${inr(x.d.t)}</b></div>`).join(""):`<p class="mute">Every member is paid up.</p>`}</div>
  <div class="card"><div class="row-b"><h2>Tally books</h2>${syncTag(s)}</div><p>Last synced ${sync[s].at}</p><p class="mute sm" style="margin:6px 0 14px">${pending(s).length} receipts created here are waiting for their Tally voucher.</p><button class="btn" onclick="go('sync')">Open Tally sync</button></div></div>
  ${ag?`<div class="card"><div class="row-b"><h2>${esc(ag.title)}</h2><span class="tag ok">${ag.rsvp.length} of ${k.n} members confirmed</span></div><p class="mute">${esc(ag.body)}</p></div>`:""}`}

function actions(){if(!canWrite())return "";const n=ALLM[latest(st.soc)+1];return `<div class="row" style="margin-bottom:12px">${n?`<button class="btn" onclick="genBills()">Generate ${n} bills</button>`:""}${canNotice()?`<button class="ghost" onclick="remDlg()">Send reminders</button>`:""}</div>${st.msg&&st.ms==st.soc?`<div class="note" role="status">${esc(st.msg)}</div>`:""}`}
function membersTable(){const q=(st.q||"").toLowerCase(),rows=memList(st.soc).filter(m=>(m.name+" "+m.flat).toLowerCase().includes(q)).map(m=>({m,d:dues(m),bl:billsOf(m.id)})).filter(x=>st.f=="all"||x.d.t>0);
  return `<div class="tw"><table><tr><th>Member</th><th>Flat</th><th class="r">Monthly charges</th><th class="r">Bills paid</th><th class="r">Principal due</th><th class="r">Interest</th><th></th></tr>${rows.map(({m,d,bl})=>`<tr><td>${esc(m.name)}${m.let?` <span class="mute sm">(let out)</span>`:""}</td><td>${m.flat}</td><td class="r">${inr(m.fee)}</td><td class="r">${bl.length-d.l.length}/${bl.length}</td><td class="r">${d.pr?`<span class="tag bad">${inr(d.pr)}</span>`:`<span class="tag ok">Clear</span>`}</td><td class="r">${d.it?inr(d.it):"-"}</td><td class="r"><button class="ghost" onclick="stmtDlg(${m.id})">Statement</button> ${d.pr&&canWrite()?`<button class="btn sm" onclick="payDlg(${m.id})">Record payment</button>`:""}</td></tr>`).join("")||`<tr><td colspan="7" class="empty">No members match.</td></tr>`}</table></div>`}
function membersView(){return head("Members and dues","Charges, dues and interest for every flat")+actions()+`<div class="row" style="margin-bottom:12px"><label style="max-width:280px;margin:0"><span class="sm mute">Search by name or flat</span><input type="search" enterkeyhint="search" autocapitalize="none" value="${esc(st.q||"")}" oninput="st.q=this.value;$('#mt').innerHTML=membersTable()"></label><div class="chips" style="padding-bottom:2px"><button class="ghost" ${st.f=="all"?'style="border-color:var(--teal)"':""} onclick="st.f='all';render()">All members</button><button class="ghost" ${st.f=="due"?'style="border-color:var(--teal)"':""} onclick="st.f='due';render()">With dues</button></div></div><div id="mt">${membersTable()}</div>${canWrite()?"":`<p class="mute sm">Secretary access is view only for money. The Treasurer records payments and expenses.</p>`}`}
function receiptsView(){const r=paysOf(st.soc).slice().sort((a,b)=>b.id-a.id);
  const ex=r.length?`<button class="ghost noprint" onclick="exportReceipts()">Export CSV</button>`:"";
  return head("Receipts","Every receipt, with its Tally voucher status",ex)+(r.length?`<div class="tw"><table><tr><th>Receipt</th><th>Member</th><th>For</th><th>Mode</th><th>Date</th><th class="r">Amount</th><th>Tally</th><th></th></tr>${r.map(p=>`<tr><td>R-${1000+p.id}</td><td>${esc(memOf(p.mem).name)}</td><td>${p.mo}</td><td>${p.mode}</td><td>${p.date}</td><td class="r">${inr(p.amt+(p.int||0))}</td><td>${tallyTag(p)}</td><td><button class="ghost" onclick="showReceipt(${p.id})">View</button></td></tr>`).join("")}</table></div>`:`<div class="empty">No receipts yet.</div>`)}
const tallyTag=p=>p.tally?`<span class="tag ok">In Tally ${p.vch}</span>`:`<span class="tag warn">Awaiting Tally</span>`;
function exportReceipts(){csv("receipts-"+socName(st.soc).replace(/ /g,"-")+".csv",[["Receipt","Member","Flat","For","Mode","Date","Amount","Interest","Tally voucher"]].concat(paysOf(st.soc).map(p=>["R-"+(1000+p.id),memOf(p.mem).name,memOf(p.mem).flat,p.mo,p.mode,p.date,p.amt,p.int||0,p.tally?p.vch:"Awaiting"])))}
function expensesView(){const s=st.soc,e=expsOf(s);
  return head("Expenses","What the society spent and on what")+`<div class="g2"><div class="card"><h2>Spend by head</h2>${donut(groupExp(s))}</div>${canWrite()?`<div class="card"><h2>Add an expense</h2><div class="row"><label>Description<input id="ed" placeholder="For example, lift repair"></label><label>Amount in rupees<input id="ea" type="number" inputmode="numeric" min="1"></label></div><div id="err" class="err" role="alert"></div><button class="btn" onclick="addExp()">Add expense</button></div>`:""}</div>
  <div class="tw"><table><tr><th>Expense</th><th>Date</th><th class="r">Amount</th></tr>${e.map(x=>`<tr><td>${esc(x.d)}</td><td>${x.date}</td><td class="r">${inr(x.amt)}</td></tr>`).join("")||`<tr><td colspan="3" class="empty">No expenses recorded.</td></tr>`}</table></div>`}
function addExp(){if(!canWrite())return;const d=$("#ed").value.trim(),a=Math.round(+$("#ea").value);if(!d||!(a>0)){$("#err").textContent="Enter a description and an amount above zero.";return}exps.push({soc:st.soc,d,amt:a,date:today()});log(st.soc,`Expense added: ${d} (${inr(a)})`);render()}
function genBills(){if(!canWrite())return;const s=st.soc,n=ALLM[latest(s)+1];if(!n)return;const ms=memList(s);ms.forEach(m=>{m.fee=chg(m).t;bills.push({mem:m.id,mo:n,amt:m.fee})});log(s,`Generated ${n} bills for ${ms.length} members`);st.msg=`${n} bills generated for ${ms.length} members. They are due on ${socOf(s).cfg.due} ${n.split(" ")[0]}.`;st.ms=s;render()}
/* record a payment received by the Treasurer */
function payDlg(id){const m=memOf(id),u=dues(m).l;openDlg(`<h2>Record payment</h2><p class="mute">${esc(m.name)}, flat ${m.flat}</p><br><label>Month<select id="pm">${u.map(b=>`<option value="${b.mo}">${b.mo}: ${inr(b.amt)} + interest ${inr(intOf(m,b))}</option>`).join("")}</select></label><label>Mode<select id="pmode">${MODES.map(x=>`<option>${x}</option>`).join("")}</select></label><div class="row"><button class="btn" onclick="savePay(${id})">Save receipt</button><button class="ghost" onclick="closeDlg()">Cancel</button></div>`)}
function savePay(id){if(!canWrite())return;const m=memOf(id),mo=$("#pm").value,b=bills.find(x=>x.mem==id&&x.mo==mo),p={id:pid++,mem:id,soc:m.soc,mo,amt:b.amt,int:intOf(m,b),date:today(),mode:$("#pmode").value,src:"Manual",tally:false};pays.push(p);log(m.soc,`Receipt R-${1000+p.id} recorded for ${m.name} (${mo}, ${inr(p.amt)} plus interest ${inr(p.int)})`);closeDlg();toast(`Receipt R-${1000+p.id} saved. It will be matched with Tally on the next sync.`)}
function showReceipt(id){const p=pays.find(x=>x.id==id);if(!p||!can(p.soc,p.mem))return;const m=memOf(p.mem);
  openDlg(`<h2>Receipt R-${1000+p.id}</h2><p class="mute">${esc(socName(p.soc))}</p><br><div class="sum"><div><span>Received from</span><b>${esc(m.name)}, flat ${m.flat}</b></div><div><span>For</span><b>${p.mo}</b></div><div><span>Mode</span><b>${p.mode}</b></div><div><span>Date</span><b>${p.date}</b></div><div><span>Charges</span><b>${inr(p.amt)}</b></div><div><span>Interest</span><b>${inr(p.int||0)}</b></div><div class="tot"><span>Total received</span><b>${inr(p.amt+(p.int||0))}</b></div></div><p class="mute sm" style="margin-top:8px">${p.tally?"Posted in Tally as voucher "+p.vch:"Waiting for its voucher to be posted in Tally"}</p><div class="row" style="margin-top:14px"><button class="btn" onclick="printDlg()">Print or save as PDF</button><button class="ghost" onclick="closeDlg()">Close</button></div>`)}
/* statements */
function stmtRows(m,mo){const e=[];billsOf(m.id).forEach(b=>{const [mm,y]=b.mo.split(" ");e.push({ts:new Date(+y,MN.indexOf(mm),1),d:"01 "+b.mo,t:"Maintenance bill "+b.mo,dr:b.amt,cr:0})});
  pays.filter(p=>p.mem==m.id&&can(p.soc,p.mem)).forEach(p=>{const ts=pd(p.date);if(p.int)e.push({ts,d:p.date,t:`Interest on arrears (${p.mo})`,dr:p.int,cr:0});e.push({ts,d:p.date,t:`Receipt R-${1000+p.id} by ${p.mode} for ${p.mo}`,dr:0,cr:p.amt+(p.int||0)})});
  const du=dues(m);if(du.it)e.push({ts:NOW,d:today(),t:"Interest accrued on unpaid bills till today",dr:du.it,cr:0});
  e.sort((a,b)=>a.ts-b.ts||(b.dr>0)-(a.dr>0));let bal=0;e.forEach(x=>{bal+=x.dr-x.cr;x.bal=bal});return !mo||mo=="all"?e:e.filter(x=>x.d.slice(3)==mo)}
function stmtTable(m,mo){const r=stmtRows(m,mo),close=dues(m).t;
  return `<h2>Statement of account</h2><p class="mute">${esc(socName(m.soc))}, ${esc(m.name)}, flat ${m.flat}. Printed on ${today()}</p><br><div class="tw" style="margin:0"><table style="min-width:480px"><tr><th>Date</th><th>Particulars</th><th class="r">Debit</th><th class="r">Credit</th><th class="r">Balance</th></tr>${r.map(x=>`<tr><td>${x.d}</td><td>${esc(x.t)}</td><td class="r">${x.dr?inr(x.dr):""}</td><td class="r">${x.cr?inr(x.cr):""}</td><td class="r">${inr(x.bal)}</td></tr>`).join("")||`<tr><td colspan="5" class="empty">No entries for this month.</td></tr>`}<tr><td colspan="4" class="b">Amount payable today</td><td class="r b">${inr(close)}</td></tr></table></div>`}
function stmtDlg(id){const m=memOf(id);if(!can(m.soc,id))return;openDlg(stmtTable(m)+`<div class="row" style="margin-top:14px"><button class="btn" onclick="printDlg()">Print or save as PDF</button><button class="ghost" onclick="closeDlg()">Close</button></div>`,true)}
/* reminders */
const remMsg=m=>{const d=dues(m);return `Dear ${m.name.split(" ")[0]}, your maintenance for ${d.l.map(b=>b.mo).join(", ")} is pending at ${socName(m.soc)}.\nCharges ${inr(d.pr)} + interest ${inr(d.it)} = ${inr(d.t)}.\nPay by UPI to ${upiId(m.soc)} or at the society office. Please ignore this if you have already paid.\nThank you, Managing Committee`};
const remList=()=>memList(st.soc).filter(m=>dues(m).t>0);
function remBody(){const l=remList();if(!l.length)return `<h2>Send reminders</h2><p class="mute">Every member is paid up. There is nobody to remind.</p><div class="row" style="margin-top:14px"><button class="ghost" onclick="closeDlg()">Close</button></div>`;
  return `<h2>Send reminders</h2><p class="mute">${l.length} member${l.length>1?"s have":" has"} dues.</p><div class="tabs sm" style="margin-top:10px">${["WhatsApp","SMS","Email"].map(c=>`<button class="${st.ch==c?"on":""}" onclick="st.ch='${c}';$('#dlg').innerHTML=remBody()">${c}</button>`).join("")}</div>${st.ch=="Email"?`<p class="sm mute">Subject: Maintenance reminder from ${esc(socName(st.soc))}</p>`:""}<div class="wa">${esc(remMsg(l[0]))}</div><p class="mute sm">Preview for ${esc(l[0].name)}. Each member gets their own amounts.</p><div class="row" style="margin-top:14px"><button class="btn" onclick="sendRem()">Send to ${l.length} member${l.length>1?"s":""}</button><button class="ghost" onclick="closeDlg()">Cancel</button></div><p class="mute sm" style="margin-top:8px">Demo only. No message is sent.</p>`}
const remDlg=()=>{if(canNotice())openDlg(remBody(),true)};
function sendRem(){if(!canNotice())return;const n=remList().length;log(st.soc,`Reminder sent to ${n} members by ${st.ch}`);closeDlg();toast(`Reminders queued for ${n} members by ${st.ch}.`)}

/* ================================================================
   7. REPORTS
   ================================================================ */
function reportsView(){const s=st.soc,sub=st.rep,k=socStats(s),ps=paysOf(s),intRec=ps.reduce((a,p)=>a+(p.int||0),0),ge=groupExp(s),te=ge.reduce((a,x)=>a+x.v,0),ti=k.c+intRec,ms=memList(s);
  const T=[["ie","Income and expenditure"],["def","Defaulters"],["col","Collection by month"]];let body="",extra="";
  if(sub=="ie")body=`<div class="card"><h2>Income and expenditure</h2><p class="mute sm">1 Jul 2026 to ${today()}, ${esc(socName(s))}</p><div class="tw" style="margin:12px 0 0"><table style="min-width:420px"><tr><th>Income</th><th class="r">Amount</th></tr><tr><td>Maintenance charges collected</td><td class="r">${inr(k.c)}</td></tr><tr><td>Interest on arrears recovered</td><td class="r">${inr(intRec)}</td></tr><tr><td class="b">Total income</td><td class="r b">${inr(ti)}</td></tr><tr><th>Expenditure</th><th></th></tr>${ge.map(x=>`<tr><td>${esc(x.l)}</td><td class="r">${inr(x.v)}</td></tr>`).join("")}<tr><td class="b">Total expenditure</td><td class="r b">${inr(te)}</td></tr><tr><td class="b">${ti>=te?"Surplus":"Deficit"} for the period</td><td class="r b ${ti>=te?"ok":"bad"}">${inr(Math.abs(ti-te))}</td></tr></table></div></div>`;
  if(sub=="def"){const l=topDef(ms,99);extra=l.length?`<button class="ghost noprint" onclick="exportDef()">Export CSV</button>`:"";body=l.length?`<div class="tw"><table><tr><th>Member</th><th>Flat</th><th>Months pending</th><th class="r">Principal</th><th class="r">Interest</th><th class="r">Total</th></tr>${l.map(x=>`<tr><td>${esc(x.m.name)}</td><td>${x.m.flat}</td><td>${x.d.l.map(b=>b.mo.slice(0,3)).join(", ")}</td><td class="r">${inr(x.d.pr)}</td><td class="r">${inr(x.d.it)}</td><td class="r b">${inr(x.d.t)}</td></tr>`).join("")}</table></div>`:`<div class="empty">No defaulters. Every member is paid up.</div>`}
  if(sub=="col"){const r=monthly(ms);body=`<div class="card"><h2>Collection by month</h2>${cols(r)}</div><div class="tw"><table><tr><th>Month</th><th class="r">Billed</th><th class="r">Collected</th><th class="r">Outstanding</th><th class="r">Collected %</th></tr>${r.map(x=>`<tr><td>${x.mo}</td><td class="r">${inr(x.b)}</td><td class="r">${inr(x.c)}</td><td class="r">${inr(x.b-x.c)}</td><td class="r">${x.b?Math.round(x.c/x.b*100):0}%</td></tr>`).join("")}</table></div>`}
  return head("Reports","Ready for the committee and the AGM",`${extra}<button class="ghost noprint" onclick="window.print()">Print</button>`)+`<div class="tabs noprint">${T.map(t=>`<button class="${sub==t[0]?"on":""}" onclick="st.rep='${t[0]}';render()">${t[1]}</button>`).join("")}</div>${body}`}
function exportDef(){csv("defaulters-"+socName(st.soc).replace(/ /g,"-")+".csv",[["Member","Flat","Months pending","Principal","Interest","Total"]].concat(topDef(memList(st.soc),99).map(x=>[x.m.name,x.m.flat,x.d.l.map(b=>b.mo).join(" "),x.d.pr,x.d.it,x.d.t])))}

/* ================================================================
   8. NOTICES AND AGM  (committee posts, members read and confirm)
   ================================================================ */
function noticesView(){const s=me.role=="member"?me.soc:st.soc,l=notices.filter(n=>n.soc==s&&canSoc(s)).slice().reverse(),n0=socStats(s).n;
  return head("Notices and AGM",me.role=="member"?"Updates from your society":"Post updates and see who is attending the AGM")+
  (canNotice()?`<div class="card"><h2>Post a notice</h2><div class="row"><label style="max-width:160px">Type<select id="nt"><option>Notice</option><option>AGM</option></select></label><label>Title<input id="nh"></label></div><label>Message<textarea id="nb" rows="3"></textarea></label><div id="err" class="err" role="alert"></div><button class="btn" onclick="postNotice()">Post notice</button></div>`:"")+
  `<div class="card">${l.map(n=>`<div class="notice"><div class="row-b" style="margin:0"><h3>${esc(n.title)}</h3><span class="tag ${n.type=="AGM"?"warn":"ok"}">${n.type}</span></div><p class="mute sm">${n.date}</p><p>${esc(n.body)}</p>${n.type=="AGM"?(me.role=="member"?`<button class="${n.rsvp.includes(me.mem)?"btn":"ghost"} sm" onclick="rsvp(${n.id})">${n.rsvp.includes(me.mem)?"You are attending. Tap to cancel":"I will attend"}</button> <span class="mute sm">${n.rsvp.length} of ${n0} confirmed</span>`:`<span class="tag ok">${n.rsvp.length} of ${n0} members confirmed</span>`):""}</div>`).join("")||`<div class="empty">No notices yet.</div>`}</div>`}
function postNotice(){if(!canNotice())return;const h=$("#nh").value.trim(),b=$("#nb").value.trim(),t=$("#nt").value;if(!h||!b){$("#err").textContent="Enter a title and a message.";return}notices.push({id:++nid,soc:st.soc,type:t,title:h,body:b,date:today(),rsvp:t=="AGM"?[]:undefined});log(st.soc,`${t} posted: ${h}`);toast("Notice posted. Members can see it now.");render()}
function rsvp(id){const n=notices.find(x=>x.id==id);if(!n||me.role!="member"||!canSoc(n.soc))return;const i=n.rsvp.indexOf(me.mem);i<0?n.rsvp.push(me.mem):n.rsvp.splice(i,1);render()}

/* ================================================================
   9. BYE-LAW RATES with live bill preview
   ================================================================ */
const CF=[["svc","Service charge per flat, rupees per month (equal for all flats)"],["int","Interest on arrears, % per year, simple (maximum 21)"],["due","Due day of the month (1 to 28)"],["nonocc","Non-occupancy charge, % of service charge (maximum 10)"],["sink","Sinking fund, % of construction cost per year"],["rep","Repairs and maintenance fund, % of construction cost per year"],["cost","Construction cost, rupees per sq ft"]];
function ratesView(){const c=socOf(st.soc).cfg,w=canWrite();
  return head("Bye-law rates","Rates used to build every member's monthly bill")+`<div class="g2"><div class="card">${CF.map(f=>`<label>${f[1]}<input id="cf_${f[0]}" type="number" inputmode="decimal" step="any" value="${c[f[0]]}" oninput="prevCalc()" ${w?"":"disabled"}></label>`).join("")}<div id="err" class="err" role="alert"></div>${w?`<button class="btn" onclick="saveCfg()">Save rates</button>`:`<p class="mute sm">Only the Treasurer can change rates.</p>`}<p class="mute sm" style="margin-top:10px">Changes apply to bills generated afterwards. Interest is simple, runs from the due date until payment, and is never compounded. Keep every rate within your registered bye-laws and general body resolutions.</p></div>
  <div class="card"><h2>Try a sample flat</h2><div class="row"><label>Area in sq ft<input id="pv_area" type="number" inputmode="numeric" value="650" oninput="prevCalc()"></label><label>Let out<select id="pv_let" onchange="prevCalc()"><option value="0">No</option><option value="1">Yes</option></select></label><label>Parking<select id="pv_park" onchange="prevCalc()"><option value="0">No</option><option value="1">Yes</option></select></label></div><div id="pv" class="sum"></div><div id="chk" class="chips" style="margin-top:12px"></div></div></div>`}
function prevCalc(){const c={};for(const f of CF)c[f[0]]=+($("#cf_"+f[0])||{}).value;const a=+$("#pv_area").value||0,lt=$("#pv_let").value=="1",pk=$("#pv_park").value=="1"?300:0,sv=c.svc,rp=Math.round(a*c.cost*c.rep/1200),sk=Math.round(a*c.cost*c.sink/1200),no=lt?Math.round(sv*c.nonocc/100):0,t=sv+rp+sk+no+pk;
  $("#pv").innerHTML=`<div><span>Service charge</span><b>${inr(sv)}</b></div><div><span>Repairs and maintenance fund</span><b>${inr(rp)}</b></div><div><span>Sinking fund</span><b>${inr(sk)}</b></div>${no?`<div><span>Non-occupancy charge</span><b>${inr(no)}</b></div>`:""}${pk?`<div><span>Parking</span><b>${inr(pk)}</b></div>`:""}<div class="tot"><span>Monthly bill</span><b>${inr(t)}</b></div>`;
  $("#chk").innerHTML=`<span class="tag ${c.int<=21?"ok":"bad"}">Interest ${c.int}% (limit 21%)</span><span class="tag ${c.nonocc<=10?"ok":"bad"}">Non-occupancy ${c.nonocc}% (limit 10%)</span>`}
function saveCfg(){if(!canWrite())return;const c=socOf(st.soc).cfg,v={};for(const f of CF)v[f[0]]=+$("#cf_"+f[0]).value;
  if(v.int<0||v.int>21||v.nonocc<0||v.nonocc>10||v.due<1||v.due>28||v.svc<0||v.sink<0||v.rep<0||v.cost<0){$("#err").textContent="Interest can be at most 21%, non-occupancy at most 10% of service charge, and the due day must be 1 to 28.";return}
  Object.assign(c,v);log(st.soc,"Bye-law rates updated");toast("Rates saved. They apply to bills generated from now on.");render()}
function logView(){const l=logOf(st.soc).slice().reverse();return head("Activity","Every change and blocked access attempt")+(l.length?`<div class="tw"><table><tr><th>When</th><th>By</th><th>Action</th></tr>${l.map(a=>`<tr><td>${a.t}</td><td>${esc(a.by)}</td><td>${a.txt.startsWith("Blocked")?`<span class="tag bad">Blocked</span> `:""}${esc(a.txt.replace(/^Blocked: /,""))}</td></tr>`).join("")}</table></div>`:`<div class="empty">No changes made in this session yet. Payments, expenses, syncs and blocked access attempts appear here.</div>`)}

/* ================================================================
   10. TALLY SYNC SCREEN  (the 4 steps from your data-flow diagram)
   ================================================================ */
const STEPS=["Connect to Tally 7.1","Fetch required data","Transform and map","Store in app database"],STEP_SUB=["Read-only, ODBC or XML","Members, ledgers, receipts","Match society codes and IDs","Update balances and reports"];
function panel(){const all=run.step==4;
  return `<div class="pipe">${STEPS.map((t,i)=>`<div class="ps ${all||run.step>i?"done":run.on&&run.step==i?"act":""}"><b>${i+1}</b><span>${t}</span><small>${STEP_SUB[i]}</small></div>`).join("")}</div>${run.on&&run.n>1?`<p class="mute sm" style="margin-bottom:8px">Society ${run.i+1} of ${run.n}: ${esc(socName(run.soc))}</p>`:""}<div class="con" id="con">${run.log.length?run.log.map(l=>`<div>${esc(l)}</div>`).join(""):`<span style="opacity:.7">Press Sync now to read the latest books from Tally 7.1.</span>`}</div>`}
function paint(){const e=$("#syncpanel");if(e){e.innerHTML=panel();const c=$("#con");if(c)c.scrollTop=c.scrollHeight}}
async function runSync(ids){ids=ids.filter(canSoc);if(run.on||!ids.length||!canWrite())return;
  run={on:true,step:-1,log:[],i:0,n:ids.length,soc:ids[0]};const f=ids.length>1?.45:1,L=t=>{run.log.push(clock()+"  "+t);paint()},S=async i=>{run.step=i;paint();await sleep(500*f)};
  render();
  for(let k=0;k<ids.length;k++){const id=ids[k],nm=socName(id);run.i=k;run.soc=id;
    await S(0);L(`${nm}: connecting to Tally 7.1 (read-only)`);await sleep(350*f);L(`Connected. Company "${nm}", FY 2026-27`);
    await S(1);const d=Tally.pull(id),hist=pays.filter(p=>p.soc==id).length;L(`Read ${d.ledgers} ledgers (member accounts, bank, expense heads)`);await sleep(350*f);L(`Read ${hist+d.vouchers.length} receipt vouchers, ${d.vouchers.length} new since the last sync`);
    await S(2);L(`Matched society code and ${members.filter(m=>m.soc==id).length} member IDs`);if(d.exception)L(`Needs review: ledger "${d.exception.ledger}" has no exact member match`);await sleep(350*f);L("Validation passed");
    await S(3);const r=applyPull(id,d);L(`Stored ${r.n} new receipts, recalculated balances, refreshed reports`);if(r.m)L(`Matched ${r.m} receipts created in this app with their Tally vouchers`);await sleep(300*f);
    sync[id]={at:today()+", "+clock()};log(id,`Tally sync: ${r.n} new receipts imported, ${r.m} matched, ${d.exception?1:0} to review`)}
  run.step=4;L("Sync complete");await sleep(400);run.on=false;render();toast("Tally sync complete.")}
function mapExc(id){const e=exc.find(x=>x.id==id);if(!e||!canWrite()||!canSoc(e.soc))return;exc.splice(exc.indexOf(e),1);log(e.soc,`Mapped Tally ledger "${e.ledger}" to ${memOf(e.mem).name}`);toast("Ledger mapped. It will be used on every future sync.");render()}
function syncView(s){const ids=(s?[s]:societies.map(x=>x.id)).filter(canSoc),w=canWrite(),ex=exc.filter(e=>ids.includes(e.soc)),pe=pending(s);
  return head("Tally sync","Reads the Tally 7.1 books. Nothing is ever written back to Tally.")+
  `<div class="card"><div class="row-b"><h2>Live sync</h2>${w?`<button class="btn" ${run.on?"disabled":""} onclick="runSync([${ids}])">${s?"Sync now":"Sync all "+ids.length+" societies"}</button>`:`<span class="mute sm">Secretary access is view only.</span>`}</div><div id="syncpanel">${panel()}</div></div>
  <div class="g2"><div><div class="tw" style="margin:0"><table><tr><th>Society</th><th>Last synced</th><th>Status</th><th class="r">Waiting</th><th></th></tr>${ids.map(id=>`<tr><td>${esc(socName(id))}</td><td>${sync[id].at}</td><td>${syncTag(id)}</td><td class="r">${pending(id).length}</td><td class="r">${w?`<button class="ghost" ${run.on?"disabled":""} onclick="runSync([${id}])">Sync</button>`:""}</td></tr>`).join("")}</table></div></div>
  <div class="card"><h2>Needs review</h2>${ex.length?ex.map(e=>`<div class="li"><div><b>Tally ledger "${esc(e.ledger)}"</b><small>Suggested member: ${esc(memOf(e.mem).name)}, flat ${memOf(e.mem).flat}, ${e.conf}% match</small></div>${w?`<button class="btn sm" onclick="mapExc(${e.id})">Confirm mapping</button>`:""}</div>`).join(""):`<p class="mute">Every Tally ledger is matched to a member.</p>`}</div></div>
  <div class="card"><h2>Waiting for a Tally voucher</h2><p class="mute sm" style="margin-bottom:10px">Receipts created in this app (online payments and counter receipts). Once the accountant posts them in Tally, the next sync matches them.</p>${pe.length?`<div class="tw" style="margin:0"><table><tr><th>Receipt</th><th>Member</th><th>Society</th><th>Source</th><th class="r">Amount</th></tr>${pe.map(p=>`<tr><td>R-${1000+p.id}</td><td>${esc(memOf(p.mem).name)}</td><td>${esc(socName(p.soc))}</td><td>${p.src}</td><td class="r">${inr(p.amt+(p.int||0))}</td></tr>`).join("")}</table></div>`:`<p class="mute">Nothing is waiting. Every receipt has a matching Tally voucher.</p>`}</div>
  <details class="card"><summary>How Tally data maps into this app</summary><div class="tw" style="margin:0 0 12px"><table style="min-width:620px"><tr><th>Read from Tally</th><th>Used for</th><th>Matched by</th></tr><tr><td>Company</td><td>Society</td><td>Tally company name to society code</td></tr><tr><td>Ledgers under Sundry Debtors</td><td>Members and their balances</td><td>Flat number in the ledger name</td></tr><tr><td>Receipt vouchers</td><td>Receipts</td><td>Voucher number, date, ledger, bank ledger gives the mode</td></tr><tr><td>Payment vouchers and expense ledgers</td><td>Expenses and reports</td><td>Ledger name</td></tr><tr><td>Opening balances</td><td>Member statements</td><td>Ledger</td></tr></table></div>
  <p class="mute sm">Sample request the integration service sends to Tally. Illustrative only. We finalise it once we see a real company export.</p><pre>${esc(`POST http://localhost:9000
<ENVELOPE>
  <HEADER><VERSION>1</VERSION><TALLYREQUEST>Export</TALLYREQUEST><TYPE>Data</TYPE><ID>Voucher Register</ID></HEADER>
  <BODY><DESC><STATICVARIABLES>
    <SVCURRENTCOMPANY>Sai Krupa CHS</SVCURRENTCOMPANY>
    <SVFROMDATE>20260401</SVFROMDATE><SVTODATE>20260930</SVTODATE>
    <VOUCHERTYPENAME>Receipt</VOUCHERTYPENAME>
    <SVEXPORTFORMAT>$$SysName:XML</SVEXPORTFORMAT>
  </STATICVARIABLES></DESC></BODY>
</ENVELOPE>`)}</pre><p class="mute sm">In the code, all of this sits behind one object named Tally. Replace its pull() function with a backend call and no screen changes.</p></details>`}

/* ================================================================
   11. MEMBER PORTAL  (matches the member flow diagram)
   ================================================================ */
function mHome(){const m=memOf(me.mem),d=dues(m),c=chg(m),last=pays.filter(p=>p.mem==m.id).sort((a,b)=>b.id-a.id).slice(0,3),ag=notices.filter(n=>n.soc==m.soc&&n.type=="AGM").slice(-1)[0],parts=[["Service",c.sv],["Repairs fund",c.rp],["Sinking fund",c.sk],["Non-occupancy",c.no],["Parking",c.pk]].filter(x=>x[1]);
  return head("Hello, "+m.name.split(" ")[0],socName(m.soc)+", flat "+m.flat)+`<div class="g2"><div class="card hero"><p class="mute">Outstanding today</p><div class="big">${inr(d.t)}</div>${d.t?`<p class="mute">Charges ${inr(d.pr)} plus interest ${inr(d.it)} for ${d.l.map(b=>b.mo).join(", ")}</p><br><button class="btn" onclick="payStart()">Pay ${inr(d.t)} now</button>`:`<p>You are fully paid up. Thank you.</p>`}</div>
  <div class="card"><h2>Your monthly charges</h2><div class="stack">${parts.map((p,i)=>`<i style="width:${p[1]/c.t*100}%;background:${COL[i]}"></i>`).join("")}</div>${parts.map((p,i)=>`<div class="li"><span><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${COL[i]};margin-right:8px"></i>${p[0]}</span><b>${inr(p[1])}</b></div>`).join("")}<div class="li b"><span>Total each month</span><span>${inr(c.t)}</span></div></div></div>
  <div class="g2"><div class="card"><div class="row-b"><h2>Recent receipts</h2><button class="ghost" onclick="go('hist')">All receipts</button></div>${last.map(p=>`<div class="li"><div><b>R-${1000+p.id}</b><small>${p.mo}, ${p.mode}, ${p.date}</small></div><button class="ghost" onclick="showReceipt(${p.id})">View</button></div>`).join("")||`<p class="mute">No receipts yet.</p>`}</div>
  ${ag?`<div class="card"><div class="row-b"><h2>${esc(ag.title)}</h2><span class="tag warn">AGM</span></div><p class="mute">${esc(ag.body)}</p><br><button class="${ag.rsvp.includes(me.mem)?"btn":"ghost"}" onclick="rsvp(${ag.id})">${ag.rsvp.includes(me.mem)?"You are attending. Tap to cancel":"I will attend"}</button></div>`:""}</div>`}
function mAcct(){const m=memOf(me.mem),d=dues(m),lp=pays.filter(p=>p.mem==m.id).sort((a,b)=>pd(b.date)-pd(a.date))[0];
  return head("My account","Your account details with the society")+`<div class="card"><dl><dt>Member number</dt><dd>M-${m.id}</dd><dt>Flat</dt><dd>${m.flat}, ${m.area} sq ft</dd><dt>Occupancy</dt><dd>${m.let?"Let out":"Owner occupied"}</dd><dt>Member since</dt><dd>${m.since}</dd><dt>Share capital</dt><dd>${inr(500)} (5 shares of ${inr(100)})</dd><dt>Advance maintenance</dt><dd>${inr(m.adv)}</dd><dt>Monthly charges</dt><dd>${inr(m.fee)}</dd><dt>Outstanding dues</dt><dd class="${d.t?"bad":"ok"}">${inr(d.t)}</dd><dt>Last payment</dt><dd>${lp?lp.date+", "+inr(lp.amt+(lp.int||0)):"None yet"}</dd></dl></div>`}
function mPay(){const m=memOf(me.mem),d=dues(m);
  return head("Make payment","Pay your maintenance online")+(d.l.length?`<div class="row-b"><p class="mute">${d.l.length} bill${d.l.length>1?"s":""} to pay</p><button class="btn" onclick="payStart()">Pay all ${inr(d.t)}</button></div><div class="tw"><table><tr><th>Month</th><th>Due date</th><th class="r">Amount</th><th class="r">Interest</th><th>Status</th><th></th></tr>${d.l.map(b=>{const dd=dueDate(m.soc,b.mo),ov=NOW>dd;return `<tr><td>${b.mo}</td><td>${fmtD(dd)}</td><td class="r">${inr(b.amt)}</td><td class="r">${inr(intOf(m,b))}</td><td><span class="tag ${ov?"bad":"warn"}">${ov?"Overdue":"Due soon"}</span></td><td class="r"><button class="btn sm" onclick="payStart('${b.mo}')">Pay</button></td></tr>`}).join("")}</table></div>`:`<div class="card"><h2>No dues</h2><p class="mute">You have paid every bill. Your receipts are under Receipts.</p></div>`)}
function mHist(){const m=memOf(me.mem),r=pays.filter(p=>p.mem==m.id&&can(p.soc,p.mem)).sort((a,b)=>b.id-a.id);
  return head("Receipts","Your payment history")+(r.length?`<div class="tw"><table><tr><th>Receipt</th><th>For</th><th>Mode</th><th>Date</th><th class="r">Amount</th><th></th></tr>${r.map(p=>`<tr><td>R-${1000+p.id}</td><td>${p.mo}</td><td>${p.mode}</td><td>${p.date}</td><td class="r">${inr(p.amt+(p.int||0))}</td><td><button class="ghost" onclick="showReceipt(${p.id})">View</button></td></tr>`).join("")}</table></div>`:`<div class="empty">No receipts yet.</div>`)}
function mStmt(){const m=memOf(me.mem),mos=["all"].concat(billsOf(m.id).map(b=>b.mo));
  return head("Statements","Monthly and annual statements, ready to print")+`<div class="row noprint" style="margin-bottom:12px"><label style="max-width:240px;margin:0">Period<select onchange="st.sm=this.value;render()">${mos.map(x=>`<option value="${x}" ${st.sm==x?"selected":""}>${x=="all"?"Whole year to date":x}</option>`).join("")}</select></label><button class="btn" onclick="window.print()">Print or save as PDF</button></div><div class="card">${stmtTable(m,st.sm)}</div>`}
function mProf(){const m=memOf(me.mem),fam=[[FN[(m.id*5+2)%16]+" "+m.name.split(" ")[1],"Spouse"],[FN[(m.id*3+7)%16]+" "+m.name.split(" ")[1],"Child"]];
  return head("Profile","Your contact details and family")+`<div class="g2"><div class="card"><h2>Contact details</h2><label>Mobile number<input id="pp" value="${esc(m.phone)}" type="tel" inputmode="numeric" autocomplete="tel-national"></label><label>Email<input id="pe" type="email" inputmode="email" autocapitalize="none" autocomplete="email" value="${esc(m.email)}"></label><div id="err" class="err" role="alert"></div><div class="row"><button class="btn" onclick="saveProf()">Save changes</button><button class="ghost" onclick="pwDlg()">Change password</button></div></div><div class="card"><h2>Family members</h2>${fam.map(f=>`<div class="li"><b>${esc(f[0])}</b><span class="mute">${f[1]}</span></div>`).join("")}</div></div>`}
function saveProf(){const m=memOf(me.mem),p=$("#pp").value.trim(),e=$("#pe").value.trim();if(!/^\d{10}$/.test(p)){$("#err").textContent="Enter a 10 digit mobile number.";return}if(!/^\S+@\S+\.\S+$/.test(e)){$("#err").textContent="Enter a valid email address.";return}m.phone=p;m.email=e;log(m.soc,`${m.name} updated contact details`);toast("Profile updated.")}
function pwDlg(){openDlg(`<h2>Change password</h2><br><label>New password<input id="np" type="password" autocomplete="new-password"></label><label>Confirm new password<input id="np2" type="password" autocomplete="new-password"></label><div id="perr" class="err" role="alert"></div><div class="row"><button class="btn" onclick="savePw()">Change password</button><button class="ghost" onclick="closeDlg()">Cancel</button></div>`)}
function savePw(){const a=$("#np").value,b=$("#np2").value;if(a.length<6){$("#perr").textContent="Use at least 6 characters.";return}if(a!=b){$("#perr").textContent="The two passwords do not match.";return}closeDlg();toast("Password changed (demo only).")}
/* online payment */
function payStart(mo){const d=dues(memOf(me.mem));pay={mo:mo?[mo]:d.l.map(b=>b.mo),method:"UPI"};openDlg(payBody())}
function setMeth(x){pay.method=x;$("#dlg").innerHTML=payBody()}
function payBody(){const m=memOf(me.mem),sel=dues(m).l.filter(b=>pay.mo.includes(b.mo)),pr=sel.reduce((a,b)=>a+b.amt,0),it=sel.reduce((a,b)=>a+intOf(m,b),0);
  return `<h2>Pay maintenance</h2><p class="mute">${esc(socName(m.soc))}, flat ${m.flat}</p><div class="sum" style="margin:12px 0">${sel.map(b=>`<div><span>${b.mo}</span><b>${inr(b.amt)}</b></div>`).join("")}<div><span>Interest on arrears</span><b>${inr(it)}</b></div><div class="tot"><span>Total</span><b>${inr(pr+it)}</b></div></div>
  <div class="tabs">${["UPI","Card","Net banking"].map(x=>`<button class="${pay.method==x?"on":""}" onclick="setMeth('${x}')">${x}</button>`).join("")}</div>
  ${pay.method=="UPI"?`<div class="upi">${qr(m.soc*31+7)}<div><p class="b">Scan with any UPI app</p><p class="mute sm">UPI ID: ${upiId(m.soc)}</p></div></div>`:pay.method=="Card"?`<label>Card number<input value="4242 4242 4242 4242" inputmode="numeric" autocomplete="cc-number"></label><div class="row"><label>Expiry<input value="12/28" inputmode="numeric" autocomplete="cc-exp"></label><label>CVV<input type="password" value="123" inputmode="numeric" autocomplete="cc-csc"></label></div>`:`<label>Bank<select><option>HDFC Bank</option><option>State Bank of India</option><option>ICICI Bank</option><option>Bank of Maharashtra</option></select></label>`}
  <div class="row"><button class="btn" id="paybtn" onclick="doPay()">Pay ${inr(pr+it)}</button><button class="ghost" onclick="closeDlg()">Cancel</button></div><p class="mute sm" style="margin-top:8px">Demo only. No money moves.</p>`}
async function doPay(){if(me.role!="member")return;const m=memOf(me.mem),sel=dues(m).l.filter(b=>pay.mo.includes(b.mo));if(!sel.length)return;
  const bt=$("#paybtn");bt.disabled=true;bt.textContent="Processing payment";await sleep(1200);
  const rs=sel.map(b=>{const p={id:pid++,mem:m.id,soc:m.soc,mo:b.mo,amt:b.amt,int:intOf(m,b),date:today(),mode:pay.method,src:"Online",tally:false};pays.push(p);return p});
  log(m.soc,`Online payment by ${m.name}: ${rs.map(p=>"R-"+(1000+p.id)).join(", ")} (${inr(rs.reduce((a,p)=>a+p.amt+p.int,0))} by ${pay.method})`);
  $("#dlg").innerHTML=`<h2>Payment received</h2><p class="mute">Thank you, ${esc(m.name.split(" ")[0])}. Your receipts are ready.</p><div class="sum" style="margin:12px 0">${rs.map(p=>`<div><span>R-${1000+p.id}, ${p.mo}</span><b>${inr(p.amt+p.int)}</b></div>`).join("")}</div><div class="row"><button class="btn" onclick="showReceipt(${rs[0].id})">View receipt</button><button class="ghost" onclick="closeDlg()">Done</button></div>`}
render();
</script>
</body>
